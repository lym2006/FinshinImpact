[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finshin-impact"
version = "0.1.4"
description = "一个基于 aiogram 的机器人"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiogram==3.29.1",
    "aiohttp==3.14.1",
    "aiohttp-socks==0.11.0",
    "beautifulsoup4==4.14.3",
    "httpx==0.28.1",
    "markdown==3.10.2",
    "numpy==2.4.3",
    "opencv-python==4.13.0.92",
    "pillow==12.1.1",
    "playwright==1.62.0",
    "pydub==0.25.1",
    "tenacity==9.1.4"
]

[tool.setuptools]
package-dir = {"" = "src"}