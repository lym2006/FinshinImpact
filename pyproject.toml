[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "finshin-impact"
version = "1.0.0-alpha.7.dev5"
description = "鱼神，启动！"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "packaging==26.3",
    "pillow==12.1.1",
    "pypinyin==0.55.0",
    "tomlkit==0.15.1",
    "pyside6-essentials==6.11.2",
]

[tool.uv.workspace]
members = ["devtools"]

[tool.finshin-impact]
uv-index-urls = [
    "https://mirrors.cloud.tencent.com/pypi/simple",
    "https://mirrors.aliyun.com/pypi/simple",
    "https://pypi.tuna.tsinghua.edu.cn/simple",
    "https://pypi.org/simple",
]
uv-cache-dir = "uv-cache"
github-mirrors = [
    "https://gh-proxy.com/",
    "https://ghproxy.net/",
]
playwright-cdn = "https://cdn.npmmirror.com/binaries/playwright"