[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "asyncbot"
version = "1.0.0-alpha.2"
description = "一个基于 aiogram 的机器人"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiogram==3.29.1",
    "aiohttp==3.14.1",
    "aiohttp-socks==0.11.0",
    "beautifulsoup4==4.14.3",
    "bleach==6.4.0",
    "httpx==0.28.1",
    "markdown==3.10.2",
    "numpy==2.4.3",
    "opencv-python==4.13.0.92",
    "packaging==26.3",
    "pillow==12.1.1",
    "playwright==1.62.0",
    "pydub==0.25.1",
    "pyside6==6.11.2",
    "tenacity==9.1.4",
    "tomlkit==0.15.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.3",
    "pyinstaller==6.22.3"
]