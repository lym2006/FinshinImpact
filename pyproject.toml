[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "finshin-impact"
version = "1.0.0-alpha.5.dev2"
description = "鱼神，启动！"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiogram==3.29.1",
    "aiohttp==3.14.1",
    "aiohttp-socks==0.11.0",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "packaging==26.3",
    "pillow==12.1.1",
    "tenacity==9.1.4",
    "tomlkit==0.15.1",
    "pyside6-essentials==6.11.2",
]

[project.optional-dependencies]
dev = [
    "import-linter==2.15",
    "pyinstaller==6.22.3",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.3",
    "uv==0.12.23",
]

[tool.finshin-impact]
uv-index-urls = [
    "https://mirrors.cloud.tencent.com/pypi/simple",
    "https://mirrors.aliyun.com/pypi/simple",
    "https://pypi.tuna.tsinghua.edu.cn/simple",
    "https://pypi.org/simple",
]
uv-cache-dir = "uv-cache"
playwright-cdn = "https://cdn.npmmirror.com/binaries/playwright"