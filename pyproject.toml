[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "finshin-impact"
version = "1.0.0-alpha.3.dev2"
description = "鱼神，启动！"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiogram==3.29.1",
    "aiohttp==3.14.1",
    "aiohttp-socks==0.11.0",
    "aiosqlite==0.22.1",
    "bleach==6.4.0",
    "httpx==0.28.1",
    "markdown==3.10.2",
    "numpy==2.4.3",
    "packaging==26.3",
    "pillow==12.1.1",
    "playwright==1.62.0",
    "pyside6-essentials==6.11.2",
    "tenacity==9.1.4",
    "tomlkit==0.15.1",
]

[project.optional-dependencies]
dev = [
    "import-linter==2.15",
    "pyinstaller==6.22.3",
    "pyright==1.1.414",
    "ruff==0.16.3",
]

[tool.finshin-impact]
removed-dependencies = [
    "beautifulsoup4",
    "soupsieve",
    "opencv-python",
    "pydub",
    "PySide6",
    "PySide6-Addons",
    "PySide6-Essentials",
    "shiboken6",
]