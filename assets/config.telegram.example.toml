# ============================================================
# Finshin Impact - Telegram 配置模板
# ============================================================

# ---------- Bot 基础设置 ----------

[basic]

# 代理
# 优先尝试该项配置，不通则依次系统代理、直连（TUN），均不通则报错并引导网络诊断
proxy = ""

# ---------- 全局设置 ----------

[global]

# 超时（秒）
# 控制读取响应、写入请求及连接池等待的最大耗时
network_timeout = 90.0

# ---------- AI 模型设置 ----------

[ai]

# API Key
# 在千问 AI 平台自行创建并填入
api_key = ""

# 温度
# 取值范围 0~2，越高越有创造性，越低越稳定
temperature = 0.7

# ---------- AI 杂项设置 ----------

[chore]

# 主人
# 具有最高权限的用户 ID（平台已依据实例区分）
owner = ""

# 触发词
# 用户消息包含关键词（如 @Bot）触发 AI 回复，不区分大小写，双击编辑
triggers = []

# 人设文件
# 勾选则从独立文件读取人设
use_file = true

# 人格设定
# 用于定义机器人的性格和行为
personality = "重要：若无必要，只能使用简体中文和英语，优先使用用户的语言。\n使用Markdown格式回复，严禁使用与Markdown语法冲突的字符。\n在表达情绪、强调重点或增加可读性时，请适量使用emoji。\n再次强调：不要随意编造你的身份和能力。"

# ---------- 数据与运维 ----------

[data]

# 清理间隔（小时）
# 定期清理过期的会话数据
clearup = 6.0

# 检测间隔（小时）
# 间隔多久检测一次后台任务
waiting = 0.5
