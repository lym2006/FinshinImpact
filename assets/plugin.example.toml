# 插件清单模板 — 复制到 src/plugins/<目录名>/plugin.toml 后按需改值

# 与插件目录名一致
name = "name"

# 面板显示名
title = "title"

# 面板一行说明
summary = "summary"

# 恒启用与加载档位由本体随包表决定，清单不写 core/order

# 本插件独有的库，核心插件依赖及公共库走 pyproject
deps = ["markdown==3.10.2"]

# 非 pip 资源，两段式「模块名 资源名」，启用时面板装、取消无主即卸，无则留空
assets = ["playwright chromium-headless-shell"]

# 帮助菜单贡献，可多段
[[help]]
section = "section"
note = "note"  # 只写清单字段表达不了的规矩，无则省略

# 必须与插件实际注册的路由一致，多列误放行、少列误拦截
[[help.commands]]
cmd = "cmd"
desc = "desc"
flags = []  # 额外开关，每项写成 ["-i", "说明"]，要带值再补一段值名 ["-t", "说明", "秒数"]，-h 不写，全命令默认可用
args = ""  # 命令后面要带的内容，写成一句说明，不填即不认
role = "member"  # 权限档三选一：owner / admin / member，与代码里的守卫档位一致
